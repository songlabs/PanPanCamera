name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and verify Xcode 26.3
        run: bash scripts/select_xcode.sh

      - name: Validate project and delivery scripts
        run: |
          set -euo pipefail
          python3 scripts/check_project.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts/tests -v
          xcodebuild -list -project PanPanCamera.xcodeproj | tee "$RUNNER_TEMP/project-list.log"
          xcodebuild -showdestinations -project PanPanCamera.xcodeproj -scheme PanPanCamera \
            | tee "$RUNNER_TEMP/destinations.log"

      - name: Select iOS 26 iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j | tee "$RUNNER_TEMP/available-simulators.json"
          python3 scripts/select_simulator.py "$RUNNER_TEMP/available-simulators.json"

      - name: Build and run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project PanPanCamera.xcodeproj -scheme PanPanCamera \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PanPanCameraTests \
            -resultBundlePath "$RUNNER_TEMP/PanPanCameraTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Build Release for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PanPanCamera.xcodeproj -scheme PanPanCamera \
            -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/release-build.log"

      - name: Test screenshot isolation in Release
        run: |
          set -euo pipefail
          xcodebuild test \
            -project PanPanCamera.xcodeproj -scheme PanPanCamera \
            -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PanPanCameraTests/ScreenshotConfigurationTests \
            -resultBundlePath "$RUNNER_TEMP/ReleaseScreenshotTests.xcresult" \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/release-screenshot-tests.log"

      - name: Collect Simulator and test diagnostics
        if: always()
        run: bash scripts/collect_simulator_diagnostics.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panpan-ios-ci-diagnostics
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/available-simulators.json
            ${{ runner.temp }}/simulator-diagnostics/
          retention-days: 7
          if-no-files-found: warn

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require main and validate version
        env:
          REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::TestFlight can only run from main.'
            exit 1
          fi
          if [[ ! "$REQUESTED_MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo '::error::marketing_version must contain two or three numeric components.'
            exit 1
          fi

      - name: Verify iOS CI passed for current commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/ios-ci-runs.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"
          python3 scripts/verify_ci_gate.py "$RUNNER_TEMP/ios-ci-runs.json" "$GITHUB_SHA"

  archive-and-upload:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    environment: testflight
    env:
      APP_BUNDLE_ID: com.songlabs.PanPanCamera
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required release configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_PANPAN_BASE64: ${{ secrets.PROFILE_PANPAN_BASE64 }}
        run: python3 scripts/validate_release_configuration.py

      - name: Select and verify Xcode 26.3
        run: bash scripts/select_xcode.sh

      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Install and validate fixed distribution signing
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_PANPAN_BASE64: ${{ secrets.PROFILE_PANPAN_BASE64 }}
        run: bash scripts/install_distribution_signing.sh

      - name: Archive with manual distribution signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project PanPanCamera.xcodeproj -scheme PanPanCamera \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PanPanCamera.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE_SHA1" \
            PROVISIONING_PROFILE_SPECIFIER="$PANPAN_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Verify archive structure versions signatures and entitlements
        run: |
          set -euo pipefail
          bash scripts/verify_distribution_archive.sh "$RUNNER_TEMP/PanPanCamera.xcarchive" \
            2>&1 | tee "$RUNNER_TEMP/archive-verification.log"

      - name: Create manual export options
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          options = {
              'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'], 'signingCertificate': os.environ['SIGNING_CERTIFICATE_SHA1'],
              'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['PANPAN_PROFILE_UUID']},
              'manageAppVersionAndBuildNumber': False, 'stripSwiftSymbols': True, 'uploadSymbols': True
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PanPanCamera.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s "$RUNNER_TEMP/export/PanPanCamera.ipa"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          key_path="$key_directory/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          openssl pkey -in "$key_path" -check -noout

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/upload_testflight.sh

      - name: Remove temporary signing materials and API key
        if: always()
        run: bash scripts/cleanup_distribution_signing.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panpan-testflight-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/export/DistributionSummary.plist
          retention-days: 7
          if-no-files-found: warn
